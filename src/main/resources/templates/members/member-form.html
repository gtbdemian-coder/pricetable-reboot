<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f4f6f8;
            font-family: Arial, sans-serif;
        }

        .signup-box {
            width: 350px;
            padding: 40px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .signup-box h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: bold;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .signup-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: #2d6cdf;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .signup-btn:hover {
            background-color: #1f56b5;
        }
    </style>
</head>

<body>

<div class="signup-box">

    <h2>회원가입</h2>

    <form th:action="@{/members/new}" th:object="${memberDto}" method="post">

        <div class="input-group">
            <label>아이디</label>
            <input type="text" th:field="*{loginId}">
        </div>

        <div class="input-group">
            <label>비밀번호</label>
            <input type="password" th:field="*{password}">
        </div>

        <div class="input-group">
            <label>이름</label>
            <input type="text" th:field="*{name}">
        </div>

        <button type="submit" class="signup-btn">가입하기</button>

    </form>

</div>

</body>
</html>
