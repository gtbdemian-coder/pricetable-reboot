<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
</head>
<body>

    <h2>회원가입</h2>

    <form th:action="@{/members/new}" th:object="${memberDto}" method="post">
        <div>
            <label>아이디</label>
            <input type="text" th:field="*{loginId}">
        </div>

        <div>
            <label>비밀번호</label>
            <input type="password" th:field="*{password}">
        </div>

        <div>
            <label>이름</label>
            <input type="text" th:field="*{name}">
        </div>

        <button type="submit">가입</button>
    </form>
</body>
</html>
