<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
</head>
<body>

<h2>로그인</h2>

<form th:action="@{/login}" th:object="${loginDto}" method="post">
    <div>
        <label>아이디</label>
        <input type="text" th:field="*{loginId}">
    </div>

    <div>
        <label>비밀번호</label>
        <input type="password" th:field="*{password}">
    </div>

    <button type="submit">로그인</button>
</form>

<p th:if="${errorMessage}" th:text="${errorMessage}"></p>

</body>
</html>
